name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Allocate isolated deployed fixture
        env: {HEADLESS_E2E_ALLOCATOR_TOKEN: '${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}'}
        run: bash .github/scripts/headless-fixture.sh allocate
      - name: Run deployed browser order journey
        run: npm run test:e2e:live
      - name: Release isolated deployed fixture
        if: always()
        env: {HEADLESS_E2E_ALLOCATOR_TOKEN: '${{ secrets.HEADLESS_E2E_ALLOCATOR_TOKEN }}'}
        run: bash .github/scripts/headless-fixture.sh release
